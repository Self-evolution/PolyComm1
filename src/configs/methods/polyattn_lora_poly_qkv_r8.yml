method:
  name: polyattn
  max_hops: 3
  mode: static
  headwise: true
  parameterization: delta
  delta_scale: 0.5
  coeff_activation: tanh
  coeff_dropout: 0.0
  dropout_target: high_order
  norm_constraint: 0.5
  coeff_trainable: true
  qkv_adapter_rank: 8
  qkv_adapter_alpha: 16
  qkv_adapter_dropout: 0.0
