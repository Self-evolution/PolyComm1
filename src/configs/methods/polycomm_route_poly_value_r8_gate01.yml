method:
  name: polycomm
  max_hops: 3
  mode: dynamic
  headwise: true
  mlp_ratio: 0.03125
  parameterization: delta
  delta_scale: 0.5
  coeff_activation: tanh
  coeff_dropout: 0.0
  dropout_target: high_order
  norm_constraint: 0.5
  coeff_trainable: true
  dora_qkv_rank: 8
  dora_qkv_alpha: 16
  dora_qkv_dropout: 0.0
  dora_qkv_ssf: true
  dora_qkv_gate_init: 0.1
  dora_qkv_gate_mode: dynamic
  dora_qkv_gate_scope: calibrated
  dora_qkv_gate_mlp_ratio: 0.03125
  dora_qkv_gate_temperature: 1.0
  value_adapter_rank: 8
  value_adapter_alpha: 16
  value_adapter_dropout: 0.0
  ssf_target_modules: [proj, norm]
  inject_norm: true
