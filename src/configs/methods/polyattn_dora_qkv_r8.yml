method:
  name: polyattn
  max_hops: 3
  mode: static
  headwise: true
  parameterization: delta
  delta_scale: 0.5
  coeff_activation: tanh
  coeff_dropout: 0.0
  dropout_target: high_order
  norm_constraint: 0.5
  coeff_trainable: false
  dora_qkv_rank: 8
  dora_qkv_alpha: 16
  dora_qkv_dropout: 0.0
